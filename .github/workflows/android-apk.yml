name: Build Shirin AI Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'question-bank.js'
      - 'curriculum.js'
      - 'styles.css'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'cloudflare/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare web assets
        run: |
          mkdir -p www/assets
          cp index.html app.js question-bank.js curriculum.js styles.css config.js manifest.webmanifest www/
          cp -R assets/. www/assets/
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check question-bank.js
          node --check curriculum.js
      - name: Install app dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Apply Shirin AI launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/shirin-icon.svg > /tmp/shirin-icon.png
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            mkdir -p android/app/src/main/res/mipmap-$1
            convert /tmp/shirin-icon.png -resize ${2}x${2} android/app/src/main/res/mipmap-$1/ic_launcher.png
            cp android/app/src/main/res/mipmap-$1/ic_launcher.png android/app/src/main/res/mipmap-$1/ic_launcher_round.png
          done
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shirin-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
